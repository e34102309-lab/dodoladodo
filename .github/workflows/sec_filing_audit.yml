name: Fixed 61 SEC Original Filing Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sec-filing-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect-sec-filings:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: ModeC_requirements.txt
      - name: Install existing dependencies
        run: pip install -r ModeC_requirements.txt
      - name: Validate scope and collect original SEC filings
        env:
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
        run: python collect_sec_filing_inputs.py
      - name: Upload public SEC source snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fixed_61_SEC_Source_Snapshot
          path: sec_filing_snapshot
          if-no-files-found: error
          retention-days: 30
