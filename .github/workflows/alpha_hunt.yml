name: Mode-C Long-Term Value Research Pipeline

on:
  schedule:
    # Thursday after US market close: 22:00 UTC (17:00 EST / 18:00 EDT; Friday 06:00 Asia/Taipei).
    - cron: '0 22 * * 4'
    # Monthly full-market refresh, followed by Mode C on the refreshed universe.
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      refresh_universe:
        description: Run the full-market hunter before Mode C
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**.csv'
      - 'ModeC_requirements.txt'
      - '.github/workflows/alpha_hunt.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - '**.csv'
      - 'ModeC_requirements.txt'
      - '.github/workflows/alpha_hunt.yml'

concurrency:
  group: mode-c-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: ModeC_requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ModeC_requirements.txt

      - name: Compile Python Sources
        run: python -m py_compile AQR_ModeC_Agent_V12.py mode_c_evidence.py mode_c_metric_contract.py mode_c_routing.py mode_c_industry_models.py mode_c_research_priority.py total_market_hunter_v2.py run_mode_c_ai_agent.py build_mode_c_dashboard.py enhance_dashboard_ui.py validate_mode_c_outputs.py mode_c_fixture_pipeline.py

      - name: Run Unit Tests
        run: python -m unittest discover -s tests -v

  run-mode-c-pipeline:
    # Pushes and pull requests run only the inexpensive quality job. Network-heavy
    # research runs are limited to the Thursday/monthly schedules or manual runs.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: quality-checks
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: ModeC_requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ModeC_requirements.txt

      - name: Restore Full-Market Hunter Cache
        if: github.event.schedule == '0 3 1 * *' || (github.event_name == 'workflow_dispatch' && inputs.refresh_universe)
        uses: actions/cache/restore@v4
        with:
          path: |
            .hunter_cache
            hunter_checkpoint.jsonl
          key: alpha-hunter-cache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            alpha-hunter-cache-${{ github.ref_name }}-
            alpha-hunter-cache-

      - name: Monthly Full-Market Universe Refresh
        if: github.event.schedule == '0 3 1 * *' || (github.event_name == 'workflow_dispatch' && inputs.refresh_universe)
        env:
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
        run: |
          set +e
          contact_email="${USER_EMAIL:-a7924177@gmail.com}"
          python total_market_hunter_v2.py --email "$contact_email" --output-dir .
          status=$?
          set -e
          echo "HUNTER_EXIT=$status" >> "$GITHUB_ENV"
          if [ "$status" -ne 0 ]; then
            echo "::warning::Full-market hunter stopped early; Mode C will use the last complete qualified_universe.csv in the repository."
            if [ ! -f qualified_universe.csv ]; then
              exit "$status"
            fi
          fi

      - name: Save Full-Market Hunter Cache
        if: always() && (github.event.schedule == '0 3 1 * *' || (github.event_name == 'workflow_dispatch' && inputs.refresh_universe))
        uses: actions/cache/save@v4
        with:
          path: |
            .hunter_cache
            hunter_checkpoint.jsonl
          key: alpha-hunter-cache-${{ github.ref_name }}-${{ github.run_id }}

      - name: Commit Refreshed Qualified Universe
        if: env.HUNTER_EXIT == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qualified_universe.csv
          if git diff --cached --quiet; then
            echo "No qualified_universe.csv changes to commit."
          else
            git commit -m "Monthly refresh qualified universe [skip ci]"
            git push
          fi

      - name: Upload Full-Market Hunter Artifacts
        if: always() && (github.event.schedule == '0 3 1 * *' || (github.event_name == 'workflow_dispatch' && inputs.refresh_universe))
        uses: actions/upload-artifact@v4
        with:
          name: Alpha_Engine_Full_Market_Hunter
          path: |
            hunter_audit.csv
            hunter_audit.partial.csv
            qualified_universe.csv
            qualified_universe.partial.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Validate Uploaded Universe and Run Quant Engine
        env:
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          SEND_EMAIL: "0"
        run: python AQR_ModeC_Agent_V12.py

      - name: Validate Research Artifacts
        run: python validate_mode_c_outputs.py

      - name: Restore Dashboard Trend History
        uses: actions/cache/restore@v4
        with:
          path: .mode_c_state
          key: mode-c-dashboard-trends-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            mode-c-dashboard-trends-${{ github.ref_name }}-
            mode-c-dashboard-trends-

      - name: Build Static Research Dashboard
        run: python build_mode_c_dashboard.py

      - name: Enhance Static Research Dashboard UI
        run: python enhance_dashboard_ui.py public/index.html

      - name: Validate Dashboard Metric Contract
        run: python validate_mode_c_outputs.py --dashboard public/data.json --zero-report mode_c_zero_audit.json

      - name: Save Dashboard Trend History
        uses: actions/cache/save@v4
        with:
          path: .mode_c_state
          key: mode-c-dashboard-trends-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload Static Dashboard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alpha_Engine_Static_Dashboard
          path: public
          if-no-files-found: error
          retention-days: 30

      - name: Upload Research Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mode_C_Long_Term_Value_Outputs
          path: |
            mode_c_screen.csv
            mode_c_shortlist.csv
            mode_c_shortlist_by_model.csv
            mode_c_evidence_ledger.csv
            mode_c_report.md
            mode_c_agent_payload.json
            mode_c_zero_audit.json
            public
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        if: github.event.repository.private == false
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        if: github.event.repository.private == false
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy-pages:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.event.repository.private == false
    needs: run-mode-c-pipeline
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Research Dashboard
        id: deployment
        uses: actions/deploy-pages@v4
