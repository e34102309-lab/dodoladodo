name: Mode-C Fixed 100 Research Pipeline

on:
  schedule:
    # Thursday after US market close: 22:00 UTC (17:00 EST / 18:00 EDT; Friday 06:00 Asia/Taipei).
    - cron: '0 22 * * 4'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**.csv'
      - 'ModeC_requirements.txt'
      - '.github/workflows/alpha_hunt.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - '**.csv'
      - 'ModeC_requirements.txt'
      - '.github/workflows/alpha_hunt.yml'

concurrency:
  group: mode-c-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: ModeC_requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ModeC_requirements.txt

      - name: Compile Python Sources
        run: python -m py_compile AQR_ModeC_Agent_V12.py mode_c_watchlist.py mode_c_evidence.py mode_c_metric_contract.py mode_c_routing.py mode_c_industry_models.py mode_c_research_priority.py mode_c_decision_inputs.py total_market_hunter_v2.py run_mode_c_ai_agent.py build_mode_c_dashboard.py enhance_dashboard_ui.py validate_mode_c_outputs.py mode_c_fixture_pipeline.py

      - name: Validate Fixed Research Watchlist
        run: python mode_c_watchlist.py

      - name: Run Unit Tests
        run: python -m unittest discover -s tests -v

  run-mode-c-pipeline:
    # Pushes and pull requests run only the inexpensive quality job. Network-heavy
    # fixed-watchlist research runs are limited to Thursday or manual runs.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: quality-checks
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: ModeC_requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ModeC_requirements.txt

      - name: Require SEC Contact Email
        env:
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
        run: |
          if [ -z "${USER_EMAIL:-}" ]; then
            echo "::error::Missing USER_EMAIL repository secret required for SEC API identification."
            exit 1
          fi

      - name: Update and Analyze Fixed 100 Watchlist
        env:
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          SEND_EMAIL: "0"
        run: python AQR_ModeC_Agent_V12.py

      - name: Validate Research Artifacts
        run: python validate_mode_c_outputs.py

      - name: Restore Dashboard Trend History
        uses: actions/cache/restore@v4
        with:
          path: .mode_c_state
          key: mode-c-fixed-watchlist-trends-${{ hashFiles('research_watchlist.csv') }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            mode-c-fixed-watchlist-trends-${{ hashFiles('research_watchlist.csv') }}-${{ github.ref_name }}-

      - name: Build Static Research Dashboard
        run: python build_mode_c_dashboard.py

      - name: Enhance Static Research Dashboard UI
        run: python enhance_dashboard_ui.py public/index.html

      - name: Validate Dashboard Metric Contract
        run: python validate_mode_c_outputs.py --dashboard public/data.json --zero-report mode_c_zero_audit.json

      - name: Save Dashboard Trend History
        uses: actions/cache/save@v4
        with:
          path: .mode_c_state
          key: mode-c-fixed-watchlist-trends-${{ hashFiles('research_watchlist.csv') }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload Static Dashboard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alpha_Engine_Static_Dashboard
          path: public
          if-no-files-found: error
          retention-days: 30

      - name: Upload Research Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mode_C_Long_Term_Value_Outputs
          path: |
            research_watchlist.csv
            mode_c_screen.csv
            mode_c_shortlist.csv
            mode_c_shortlist_by_model.csv
            mode_c_evidence_ledger.csv
            mode_c_report.md
            mode_c_agent_payload.json
            mode_c_zero_audit.json
            public
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        if: github.event.repository.private == false
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        if: github.event.repository.private == false
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy-pages:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.event.repository.private == false
    needs: run-mode-c-pipeline
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Research Dashboard
        id: deployment
        uses: actions/deploy-pages@v4
